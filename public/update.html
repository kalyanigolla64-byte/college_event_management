<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Event | Kalyani</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body class="page-update"><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon">✦</span> Kalyani <small>EVENT MANAGEMENT</small></a><nav class="nav"><a href="index.html">Home</a><a href="insert.html">Insert</a><a class="active" href="update.html">Update</a><a href="delete.html">Delete</a><a href="search.html">Search</a><a href="events.html">All Events</a></nav></header><main class="form-page"><div class="form-intro"><p class="eyebrow">EDIT RECORD</p><h1>Update an event</h1><p>Find an event by its ID, load its details, and save your changes.</p></div><section class="form-card"><div class="lookup-row"><label>Event ID<select id="updateId" required><option value="">Choose an event ID…</option></select></label><button id="loadEvent" class="btn btn-primary" type="button">Load event</button></div><div id="formMessage" class="notice hidden"></div><form id="eventForm" class="hidden"><div class="form-grid"><label>Event name *<input name="event_name" required maxlength="150"></label><label>Event type *<select name="event_type" required><option value="">Choose event type</option><option>Technical</option><option>Cultural</option><option>Workshop</option><option>Sports</option><option>Seminar</option><option>Fest</option><option>Other</option></select></label><label>Event date *<input name="event_date" type="date" required></label><label>Venue *<input name="venue" required maxlength="150"></label><label class="full">Description<textarea name="description" rows="4"></textarea></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Update event ↗</button></div></form></section></main><footer>© 2026 Kalyani College Event Management</footer></body></html>
